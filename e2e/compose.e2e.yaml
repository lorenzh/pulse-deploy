# TEST ONLY. E2E fixtures, merged after full/compose.yaml or dev/compose.yaml by e2e/compose-e2e.sh
# only: COMPOSE_FILE=full/compose.yaml:e2e/compose.e2e.yaml (E2E_SETUP=full) or
# COMPOSE_FILE=dev/compose.yaml:e2e/compose.e2e.yaml (E2E_SETUP=dev). Never part of a user setup.
# Relative paths resolve from full/ or dev/, the directory of the first file. Both are siblings of
# e2e/, so ../e2e/... works for both. No image line here: the base file decides the images.
services:
  api:
    environment:
      # The checks file comes from a writable directory mount (a copy made by e2e/compose-e2e.sh):
      # the pinned api 0.1.0 writes admin checks to it, and component and window writes need it on
      # every api. An api with database checks stores checks in its database and leaves the file
      # as it is. The regular read-only mount below stays, for the read-only write test.
      PULSE_CHECKS_FILE: /config-rw/checks.json
      PULSE_CHECKS_RELOAD_INTERVAL_MS: "2000"
    volumes:
      # Same target path as in full/compose.yaml, so this replaces the regular read-only directory.
      - ../e2e/ro:/config:ro
      - ../e2e/rw:/config-rw
    ports:
      # Test only: the e2e drives the api from the host.
      - "127.0.0.1:${PULSE_API_PORT:-3000}:3000"

  status:
    environment:
      # Turns on /feed.atom.
      PULSE_STATUS_PUBLIC_URL: http://status.e2e.invalid

  notify:
    volumes:
      # Same target path as in full/compose.yaml: this replaces the regular channels with
      # component-routed ones for the manual incident scenario.
      - ../e2e/notify.json:/config/notify.json:ro

  probe:
    environment:
      # Resolved by the probe for the header {"env": "PULSE_HEADER_SVC_TOKEN"} of the check e2e-post.
      # The env value is the whole header value, so it carries the "Bearer " scheme.
      PULSE_HEADER_SVC_TOKEN: Bearer ${E2E_SVC_TOKEN:-e2e-svc-token-sentinel}
      # Probe main sends an env header only to a host bound here. Older probes ignore this variable.
      # The value names the variable and the host only, never the secret.
      PULSE_PROBE_HEADER_HOSTS: '{"PULSE_HEADER_SVC_TOKEN":["e2e-target"]}'
    depends_on:
      e2e-target:
        condition: service_started

  # Target of the check e2e-post in e2e/ro/checks.json: see e2e/target.mjs.
  e2e-target:
    extends: { file: ../common/services.yaml, service: bun-tools }
    command: ["bun", "/e2e/target.mjs"]
    environment:
      PULSE_HEADER_SVC_TOKEN: ${E2E_SVC_TOKEN:-e2e-svc-token-sentinel}
    volumes:
      - ../e2e/target.mjs:/e2e/target.mjs:ro
