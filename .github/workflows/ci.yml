name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily: the dev job builds each service's main; on Mondays pins-latest also checks for releases.
    - cron: "23 4 * * *"

permissions:
  contents: read

jobs:
  check:
    uses: lorenzh/pulse-config/.github/workflows/check.yml@04108fa0c67d9a79c0f6d1ade4dd78df3ad8a4a7

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions (Compose >= 2.23)
        run: |
          docker compose version
          shellcheck --version | head -n 2
          jq --version
          node --version
          v=$(docker compose version --short)
          printf '%s\n2.23.0\n' "${v#v}" | sort -V -C -r || { echo "Docker Compose ${v} is older than 2.23"; exit 1; }
      - name: shellcheck and bash -n
        run: |
          git ls-files -z '*.sh' | xargs -0 shellcheck -x
          git ls-files -z '*.sh' | xargs -0 -n 1 bash -n
      - name: node --check
        run: git ls-files -z '*.mjs' | xargs -0 -n 1 node --check
      - name: jq empty
        run: git ls-files -z '*.json' | xargs -0 -n 1 jq empty
      - name: Outage gate
        run: bash e2e/outage-history.test.sh
      - name: metric_is helper
        run: bash e2e/metric-is.test.sh
      - name: manual_count helpers
        run: bash e2e/manual-count.test.sh
      - name: published_port helper
        run: bash e2e/published-port.test.sh
      - name: console-setup form tokens (stub curl, docker, node)
        run: bash e2e/console-setup.test.sh
      - name: snippet decoder and one-interval wait
        run: bash e2e/snippet.test.sh
      - name: dev console probe prefills (compose config)
        run: bash e2e/dev-console-prefills.test.sh
      - name: Incident card extractor test
        run: bash e2e/incident-card.test.sh
      - name: Failure logs redact credentials (stub docker)
        run: bash e2e/redact.test.sh
      - name: email subscriptions helpers and override config
        run: bash e2e/subscriptions.test.sh
      - name: runtime settings helpers, receiver and overlay config
        run: bash e2e/runtime-settings.test.sh
      - name: Static setup checks
        run: scripts/check-setup.sh
      - name: Static setup checks reject broken setups
        run: bash scripts/check-setup.test.sh
      - name: secrets-init refuses bad secrets
        run: bash scripts/secrets-init.test.sh
      - name: bump-images refuses bad registry answers (stub curl)
        run: bash scripts/bump-images.test.sh
      - name: wait-ready keeps its timeout on a hanging request (stub docker)
        run: bash scripts/wait-ready.test.sh
      - name: init-secrets never writes through a planted symlink
        run: bash scripts/init-secrets.test.sh

  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned digests equal ghcr.io (anonymous)
        run: scripts/bump-images.sh --verify

  minimal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/init-secrets.sh
      - run: docker compose -f minimal/compose.yaml pull
      - name: Start, wait for readiness and measure
        run: scripts/measure.sh minimal
      - name: api-health has a state within 90 s
        run: |
          deadline=$((SECONDS + 90))
          until curl -fsS --max-time 5 http://127.0.0.1:3000/checks |
            jq -e '.[] | select(.id == "api-health" and .state != "unknown")'; do
            ((SECONDS < deadline)) || { echo "api-health has no state after 90 s"; exit 1; }
            sleep 2
          done
      - name: Stack state and logs
        if: failure()
        run: |
          docker compose -f minimal/compose.yaml ps --all
          docker compose -f minimal/compose.yaml logs --no-color
      - name: Teardown
        if: always()
        run: docker compose -f minimal/compose.yaml down -v --remove-orphans

  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/init-secrets.sh
      - run: docker compose -f full/compose.yaml pull
      - name: Start, wait for readiness and measure
        run: scripts/measure.sh full
      - name: Stack state and logs
        if: failure()
        run: |
          docker compose -f full/compose.yaml ps --all
          docker compose -f full/compose.yaml logs --no-color
      - run: docker compose -f full/compose.yaml down -v
      - name: End-to-end test
        timeout-minutes: 30
        run: bash e2e/compose-e2e.sh
      - name: Teardown
        if: always()
        run: |
          docker compose -f full/compose.yaml down -v --remove-orphans
          docker compose -p pulse-e2e -f full/compose.yaml -f e2e/compose.e2e.yaml down -v --remove-orphans

  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose -f demo/compose.yaml pull
      - name: Start (no other step before it)
        run: |
          date +%s >"$RUNNER_TEMP/demo-up"
          docker compose -f demo/compose.yaml up -d
      - run: scripts/wait-ready.sh demo/compose.yaml 300
      - name: Open incident, DOWN mail, no host secret, status page
        run: |
          deadline=$(($(cat "$RUNNER_TEMP/demo-up") + 300))
          open_incidents() {
            docker compose -f demo/compose.yaml exec -T api bun -e \
              "fetch('http://127.0.0.1:3000/incidents').then((r) => r.text()).then((t) => process.stdout.write(t))"
          }
          incident_ok() {
            open_incidents | jq -e '[.[] | select(.resolvedAt == null)] | length >= 1 and
              any(.[]; .checkId == "down-on-purpose" and .resolvedAt == null)' >/dev/null
          }
          mail_ok() {
            curl -fsS --max-time 5 http://127.0.0.1:8025/api/v1/messages | jq -e 'any(.messages[];
              (.Subject | test("^\\[pulse demo\\] DOWN: ")) and any(.To[]; .Address == "ops@example.com"))' >/dev/null
          }
          until incident_ok; do
            (($(date +%s) < deadline)) || { echo "(a) no open down-on-purpose incident within 300 s of up"; exit 1; }
            sleep 5
          done
          echo "ok: (a) an open incident, among them down-on-purpose"
          until mail_ok; do
            (($(date +%s) < deadline)) || { echo "(b) no DOWN mail to ops@example.com within 300 s of up"; exit 1; }
            sleep 5
          done
          echo "ok: (b) mailpit holds a [pulse demo] DOWN: mail to ops@example.com"
          [[ ! -e secrets ]] || { echo "(c) a secrets/ directory exists"; exit 1; }
          echo "ok: (c) no secrets/ directory in the checkout"
          curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8080/
          (($(date +%s) <= deadline)) || { echo "(d) after the deadline"; exit 1; }
          echo "ok: (d) GET / on the status page answers 200, $(($(date +%s) - deadline + 300)) s after up"
      - name: Stack state and logs
        if: failure()
        run: |
          docker compose -f demo/compose.yaml ps --all
          docker compose -f demo/compose.yaml logs --no-color
      - name: Teardown
        if: always()
        run: docker compose -f demo/compose.yaml down -v --remove-orphans

  dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pulse-deploy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lorenzh/pulse-api
          ref: main
          path: pulse-api
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lorenzh/pulse-probe
          ref: main
          path: pulse-probe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lorenzh/pulse-status
          ref: main
          path: pulse-status
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lorenzh/pulse-notify
          ref: main
          path: pulse-notify
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lorenzh/pulse-console
          ref: main
          path: pulse-console
          persist-credentials: false
      - working-directory: pulse-deploy
        run: scripts/init-secrets.sh
      - working-directory: pulse-deploy
        run: docker compose -f dev/compose.yaml up -d --build
      - working-directory: pulse-deploy
        run: scripts/wait-ready.sh dev/compose.yaml 900
      - name: Console setup, sign-in and recreation
        working-directory: pulse-deploy
        run: bash e2e/console-setup.sh dev/compose.yaml
      - name: Stack state and logs
        if: failure()
        working-directory: pulse-deploy
        run: |
          docker compose -f dev/compose.yaml ps --all
          docker compose -f dev/compose.yaml logs --no-color
      - name: Teardown
        if: always()
        working-directory: pulse-deploy
        run: docker compose -f dev/compose.yaml down -v --remove-orphans
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install the CLI dependencies
        working-directory: pulse-deploy
        run: bun install --frozen-lockfile
      - name: pulse CLI against the dev setup (source CLI)
        working-directory: pulse-deploy
        env:
          PULSE_SRC_DIR: ${{ github.workspace }}
        run: bash cli/test/stack.sh dev

  e2e-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pulse-deploy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lorenzh/pulse-api
          ref: main
          path: pulse-api
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lorenzh/pulse-probe
          ref: main
          path: pulse-probe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lorenzh/pulse-status
          ref: main
          path: pulse-status
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lorenzh/pulse-notify
          ref: main
          path: pulse-notify
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lorenzh/pulse-console
          ref: main
          path: pulse-console
          persist-credentials: false
      - name: Revisions of the service checkouts
        run: |
          for svc in api probe status notify console; do
            echo "pulse-${svc} $(git -C "pulse-${svc}" rev-parse HEAD)"
          done
      - working-directory: pulse-deploy
        run: scripts/init-secrets.sh
      - name: End-to-end test on dev (build and test)
        working-directory: pulse-deploy
        timeout-minutes: 60
        run: |
          set -o pipefail
          E2E_SETUP=dev bash e2e/compose-e2e.sh | tee e2e-dev.log
          grep -qx 'ok: manual incident privacy' e2e-dev.log
          grep -qx 'ok: console probe locations' e2e-dev.log
          grep -qx 'ok: console incidents and maintenance' e2e-dev.log
          grep -qx 'ok: email subscriptions' e2e-dev.log
          grep -qx 'ok: runtime settings' e2e-dev.log
      - name: Teardown
        if: always()
        working-directory: pulse-deploy
        run: docker compose -p pulse-e2e -f dev/compose.yaml -f e2e/compose.e2e.yaml down -v --remove-orphans

  pins-latest:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A newer pulse release exists (Mondays only)
        run: |
          if [[ "$(date -u +%u)" != "1" ]]; then echo "not Monday: skipped"; exit 0; fi
          scripts/bump-images.sh --check-latest

  cli-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: pulse-linux-x64
          - runner: ubuntu-24.04-arm
            asset: pulse-linux-arm64
          - runner: macos-15
            asset: pulse-darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Compile the native binary
        run: bun build --compile --minify cli/main.ts --outfile "dist/$ASSET"
      - name: Sign ad hoc when macOS refuses to run it
        if: runner.os == 'macOS'
        run: |
          if "dist/$ASSET" --version >/dev/null 2>&1; then
            echo "- macOS: the binary ran unsigned; codesign was not needed" >> "$GITHUB_STEP_SUMMARY"
          else
            codesign --sign - "dist/$ASSET"
            echo "- macOS: codesign ad hoc was needed" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Smoke test without Bun on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cp "dist/$ASSET" "$RUNNER_TEMP/bin/pulse"
          env -i PATH="$RUNNER_TEMP/bin:/usr/bin:/bin" HOME="$HOME" bash cli/test/smoke.sh
      - name: Documented download check (OK, changed byte, unlisted asset)
        run: |
          w="$RUNNER_TEMP/verify"
          mkdir -p "$w"
          cp "dist/$ASSET" "$w/$ASSET"
          cd "$w"
          e=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          if command -v sha256sum >/dev/null 2>&1; then own=$(sha256sum "$ASSET"); else own=$(shasum -a 256 "$ASSET"); fi
          {
            echo "${own%% *}  $ASSET"
            for other in pulse-linux-x64 pulse-linux-arm64 pulse-darwin-arm64; do
              [[ "$other" == "$ASSET" ]] || echo "$e  $other"
            done
          } > SHA256SUMS
          out=$(bash "$GITHUB_WORKSPACE/cli/test/verify-download.sh" "$ASSET")
          test "$out" = "$ASSET: OK"
          cp "$ASSET" x
          printf 'X' | dd of="$ASSET" bs=1 seek=100 conv=notrunc 2>/dev/null
          set +e
          bash "$GITHUB_WORKSPACE/cli/test/verify-download.sh" "$ASSET"; changed=$?
          bash "$GITHUB_WORKSPACE/cli/test/verify-download.sh" x; unlisted=$?
          set -e
          test "$changed" = 1 && test "$unlisted" = 1
          echo "verify-download: OK 0, changed byte 1, unlisted asset 1"
      - name: Binary size and init time
        run: |
          bytes=$(wc -c < "dist/$ASSET" | tr -d ' ')
          mib=$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1048576 }')
          {
            echo "- ${{ matrix.runner }}: $ASSET is $bytes bytes ($mib MiB) and ran natively"
            python3 cli/test/measure-init.py "dist/$ASSET" "${{ matrix.runner }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Self-test of the median rule
        run: python3 cli/test/measure-init.py --self-test

  cli-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Render 8 variants and check them
        run: bash cli/test/render-variants.sh

  cli-stack:
    strategy:
      fail-fast: false
      matrix:
        variant: [demo, full, minimal]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: pulse CLI against a live ${{ matrix.variant }} stack
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash cli/test/stack.sh "$VARIANT"

  cli-errors:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Docker failure paths with the stub docker
        run: bash cli/test/errors.sh dist/pulse
