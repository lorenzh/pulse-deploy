# Shared service definitions of every setup. Each setup service reuses one of them with
#   extends: { file: ../common/services.yaml, service: <name> }
# This is the only file that holds image pins. Bump a pulse image with scripts/bump-images.sh.
# A third-party bump is a hand edit of its line, with a digest from the approved list.
# No host paths here: `depends_on`, `ports` and `volumes` live in the setup files.
services:
  api:
    image: ghcr.io/lorenzh/pulse-api:0.1.1@sha256:de8ccf3432739243194954b9bcfe44ba7b185f27ad9664d40dcb82fb7a9b8da6
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      PULSE_TOKENS_FILE: /run/pulse/tokens.json

  probe:
    image: ghcr.io/lorenzh/pulse-probe:0.1.1@sha256:4aae94e75efa0b9161deb060d547ee9163f9e6c04cb1fc501479302bda88bc76
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      PULSE_API_URL: http://api:3000
      PULSE_PROBE_TOKEN_FILE: /run/pulse/probe-token

  status:
    image: ghcr.io/lorenzh/pulse-status:0.1.1@sha256:f4283a8cc20c5707ee22e9be3de5bb18cfe9965d62f8af964c6a7df38ad117a5
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      PULSE_API_URL: http://api:3000
    healthcheck:
      interval: 5s

  notify:
    image: ghcr.io/lorenzh/pulse-notify:0.1.1@sha256:47606577e85738d28fbe5fc422476a225c7242cc45b8a672a7372e8c3ff111bf
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      PULSE_API_URL: http://api:3000
      PULSE_NOTIFY_CONFIG: /config/notify.json

  console:
    image: ghcr.io/lorenzh/pulse-console:0.1.1@sha256:bdf26a71637f07c0b3ecca67730ba0928100f398333d8cd9c46db5e9dfc1303a
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      PULSE_API_URL: http://api:3000
    healthcheck:
      interval: 5s

  # One-shot: copies the secrets into per-consumer volumes, owned by bun (1000:1000), mode 0400.
  # Root without network and with only the capabilities that the copy needs.
  # The oven/bun image is the one of bun-tools below, so a bump edits one line.
  secrets-init:
    extends: { service: bun-tools }
    restart: "no"
    user: "0:0"
    network_mode: none
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    command: ["bun", "/scripts/secrets-init.mjs"]

  # Small helper services (secrets-init, demo init, demo targets, e2e target).
  bun-tools:
    image: oven/bun:1.4.0-alpine@sha256:07235578f79ef8c6f97d94aee7938e76f5cdba5f21ae5dbfdd3d3d38058437eb
    user: "1000:1000"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  openssl:
    image: alpine/openssl@sha256:1c361a204e9791bec6202bccbd1065eafaa65cb5a1a9a06ae000238569fba6a2
    user: "1000:1000"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Demo mail catcher. It runs as root inside its image; demo only, loopback only.
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
